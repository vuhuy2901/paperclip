services:
  core-api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://core:core@core-postgres:5432/core
      SERVICE_TOKEN: dev-service-token
      DEFAULT_RUNNER: ${DEFAULT_RUNNER:-local-deterministic}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-configured-at-runtime}
      CODEX_GATEWAY_URL: ${CODEX_GATEWAY_URL:-http://host.docker.internal:8400}
      CODEX_GATEWAY_TOKEN: ${CODEX_GATEWAY_TOKEN:-dev-codex-gateway}
    ports: ["8001:8000"]
    volumes: ["core-data:/app/data", ".:/workspace:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    build: .
    command: ["python", "-m", "apps.worker.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://core:core@core-postgres:5432/core
      SERVICE_TOKEN: dev-service-token
      DEFAULT_RUNNER: ${DEFAULT_RUNNER:-local-deterministic}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-configured-at-runtime}
      VERIFICATION_ROOT: /workspace
      PREVIEW_MANAGER_URL: http://preview-manager:8300
      WORKSPACE_ROOT: /workspace/data/worktrees
      CODEX_GATEWAY_URL: ${CODEX_GATEWAY_URL:-http://host.docker.internal:8400}
      CODEX_GATEWAY_TOKEN: ${CODEX_GATEWAY_TOKEN:-dev-codex-gateway}
    volumes: ["core-data:/app/data", ".:/workspace"]
    depends_on:
      core-api: {condition: service_healthy}
      postgres: {condition: service_healthy}
      preview-manager: {condition: service_healthy}
  preview-manager:
    build:
      context: .
      dockerfile: infra/preview/Dockerfile
    ports: ["8300:8300"]
    environment:
      PREVIEW_WORKSPACE: /workspace
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8300/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
  review-ui:
    build: ./apps/review-ui
    ports: ["8080:80"]
    depends_on:
      core-api: {condition: service_healthy}
  paperclip-adapter:
    build: ./apps/paperclip-adapter
    environment:
      CORE_API_URL: http://core-api:8000
      CORE_PUBLIC_URL: ${CORE_PUBLIC_URL:-http://localhost:8001}
      SERVICE_TOKEN: dev-service-token
      PAPERCLIP_API_URL: ${PAPERCLIP_API_URL:-http://paperclip:3100}
      PAPERCLIP_API_KEY: ${PAPERCLIP_API_KEY:-}
      PAPERCLIP_COMPANY_ID: ${PAPERCLIP_COMPANY_ID:-}
      PORT: 8090
    ports: ["8090:8090"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      core-api: {condition: service_healthy}
  paperclip:
    build:
      context: .
      dockerfile: infra/paperclip/Dockerfile
    ports: ["127.0.0.1:3100:3100"]
    environment:
      CORE_API_URL: http://core-api:8000
      SERVICE_TOKEN: dev-service-token
      # Paperclip is local-only in the demo. Keep the board usable without
      # an external organization account; never expose this mode beyond host.
      PAPERCLIP_DEPLOYMENT_MODE: local_trusted
      PAPERCLIP_BIND: loopback
      CODEX_GATEWAY_URL: ${CODEX_GATEWAY_URL:-http://host.docker.internal:8400}
      CODEX_GATEWAY_TOKEN: ${CODEX_GATEWAY_TOKEN:-dev-codex-gateway}
    depends_on:
      core-api: {condition: service_healthy}
    volumes: ["paperclip-data:/home/node/.paperclip"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(r=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  storefront-api:
    build:
      context: .
      dockerfile: templates/storefront/backend/Dockerfile
    ports: ["8200:8200"]
    environment:
      STOREFRONT_DATABASE_URL: postgresql+psycopg://storefront:storefront@core-postgres:5432/storefront
    depends_on:
      postgres: {condition: service_healthy}
  storefront-ui:
    build: ./templates/storefront/frontend
    ports: ["8201:80"]
    depends_on:
      storefront-api: {condition: service_started}
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
      POSTGRES_DB: core
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/20-storefront.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      default:
        aliases:
          - core-postgres
volumes:
  core-data:
  postgres-data:
  paperclip-data:
networks:
  default:
    name: ${COMPOSE_NETWORK_NAME:-ai_company_default}
