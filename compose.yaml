services:
  core-api:
    profiles: [legacy-core]
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://core:core@core-postgres:5432/core
      SERVICE_TOKEN: dev-service-token
      DEFAULT_RUNNER: ${DEFAULT_RUNNER:-ollama}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-llama3.2:3b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      FORCE_OLLAMA: "true"
    ports: ["8001:8000"]
    volumes: ["core-data:/app/data", ".:/workspace:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    profiles: [legacy-core]
    build: .
    command: ["python", "-m", "apps.worker.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://core:core@core-postgres:5432/core
      SERVICE_TOKEN: dev-service-token
      DEFAULT_RUNNER: ${DEFAULT_RUNNER:-ollama}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-llama3.2:3b}
      VERIFICATION_ROOT: /workspace
      PREVIEW_MANAGER_URL: http://preview-manager:8300
      WORKSPACE_ROOT: /workspace/data/worktrees
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      FORCE_OLLAMA: "true"
      AI_PM_MODEL: ${AI_PM_MODEL:-llama3.2:3b}
      AI_ARCHITECT_MODEL: ${AI_ARCHITECT_MODEL:-llama3.2:3b}
      AI_UIUX_MODEL: ${AI_UIUX_MODEL:-llama3.2:3b}
      AI_BACKEND_MODEL: ${AI_BACKEND_MODEL:-llama3.2:3b}
      AI_FRONTEND_MODEL: ${AI_FRONTEND_MODEL:-llama3.2:3b}
      AI_REVIEWER_MODEL: ${AI_REVIEWER_MODEL:-llama3.2:3b}
      AI_TESTER_MODEL: ${AI_TESTER_MODEL:-llama3.2:3b}
      AI_DEVOPS_MODEL: ${AI_DEVOPS_MODEL:-llama3.2:3b}
    volumes: ["core-data:/app/data", ".:/workspace"]
    depends_on:
      core-api: {condition: service_healthy}
      postgres: {condition: service_healthy}
      ollama: {condition: service_healthy}
      preview-manager: {condition: service_healthy}
  preview-manager:
    build:
      context: .
      dockerfile: infra/preview/Dockerfile
    ports: ["8300:8300"]
    environment:
      PREVIEW_WORKSPACE: /workspace
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8300/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
  review-ui:
    profiles: [legacy-core]
    build: ./apps/review-ui
    ports: ["8080:80"]
    depends_on:
      core-api: {condition: service_healthy}
  paperclip:
    build:
      context: .
      dockerfile: infra/paperclip/Dockerfile
    ports: ["127.0.0.1:3100:3100"]
    environment:
      # Paperclip is local-only in the demo. Keep the board usable without
      # an external organization account; never expose this mode beyond host.
      PAPERCLIP_DEPLOYMENT_MODE: local_trusted
      PAPERCLIP_BIND: loopback
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    volumes: ["paperclip-data:/home/node/.paperclip"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(r=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      ollama: {condition: service_healthy}
  storefront-api:
    build:
      context: .
      dockerfile: templates/storefront/backend/Dockerfile
    ports: ["8200:8200"]
    environment:
      STOREFRONT_DATABASE_URL: postgresql+psycopg://storefront:storefront@core-postgres:5432/storefront
    depends_on:
      postgres: {condition: service_healthy}
  storefront-ui:
    build: ./templates/storefront/frontend
    ports: ["8201:80"]
    depends_on:
      storefront-api: {condition: service_started}
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
      POSTGRES_DB: core
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/20-storefront.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      default:
        aliases:
          - core-postgres
  ollama:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & pid=$$!; until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull $${OLLAMA_MODEL:-llama3.2:3b}; wait $$pid"]
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    ports: ["11434:11434"]
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  core-data:
  postgres-data:
  paperclip-data:
  ollama-data:
networks:
  default:
    name: ${COMPOSE_NETWORK_NAME:-ai_company_default}
